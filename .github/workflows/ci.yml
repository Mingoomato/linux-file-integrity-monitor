name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  userspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install build and test dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang cmake libssl-dev libsqlite3-dev python3-jsonschema gcc-multilib
      - name: Configure
        env:
          CC: ${{ matrix.compiler }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-ci --parallel 2
      - name: Run hosted-runner tests
        run: ctest --test-dir build-ci --output-on-failure --timeout 180
